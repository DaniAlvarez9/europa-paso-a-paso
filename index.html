<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudia con Laura</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a37;--muted:#6b7280;--paper:#fbf7ef;--card:#fff;--line:#e7e0d2;--geo:#2f6fd6;--bio:#119c8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button,a{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-decoration:none}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif}
.screen{display:none;max-width:760px;margin:0 auto;padding:22px 16px 32px;animation:in .25s ease-out}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hello{font-size:15px;color:var(--muted);font-weight:700;margin:4px 0 0}
h1{font-size:34px;line-height:1.05;margin:4px 0 6px;letter-spacing:-.5px}
h1 span{color:var(--c,var(--geo))}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.4}
.list{display:grid;gap:12px}
.card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.card:active{transform:scale(.98)}
.card.soon{opacity:.55;pointer-events:none}
.ic{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.ic svg{width:48px;height:48px}
.info{flex:1;min-width:0}
.info h3{margin:0;font-size:21px}
.info p{margin:3px 0 0;font-size:13.5px;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:99px;background:#efe9dd;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.go{font-size:22px;color:var(--muted);flex:none}
.back{display:inline-block;font-weight:800;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;margin-bottom:8px}
.tnum{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:Fredoka;font-weight:700;font-size:24px;background:var(--c)}
.foot{margin-top:26px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
</style>
</head>
<body>

<section class="screen" id="s-home">
  <p class="hello">¡Hola, Laura! 👋</p>
  <h1>¿Qué <span>estudiamos</span> hoy?</h1>
  <p class="sub">Elige una materia y después el tema que quieras repasar.</p>
  <div class="list" id="materias"></div>
  <p class="foot">Hecho con cariño por el tío Dani</p>
</section>

<section class="screen" id="s-materia">
  <button class="back" onclick="go('')">← Mis materias</button>
  <h1 id="m-title"></h1>
  <p class="sub" id="m-sub"></p>
  <div class="list" id="temas"></div>
</section>

<script>
const ICON={
geo:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="#cfe3f7" stroke="#fff" stroke-width="3"/><path d="M17 22c5-3 9 1 13-1s4 6 9 6 4 7-1 9-6 8-11 6-4-6-8-7-6-9-2-14z" fill="#5cb85c"/><path d="M41 15c3 1 6 4 7 7-3 1-6-1-7-3z" fill="#5cb85c"/><circle cx="32" cy="32" r="24" fill="none" stroke="#2f6fd6" stroke-width="2.5"/></svg>`,
bio:`<svg viewBox="0 0 64 64"><rect x="14" y="52" width="36" height="6" rx="3" fill="#0e7c72"/><path d="M38 10l7 4-12 21-7-4z" fill="#119c8f"/><rect x="34" y="6" width="10" height="7" rx="2" transform="rotate(30 39 9)" fill="#0e7c72"/><path d="M22 40h20a10 10 0 0 1-20 0z" fill="#9ad9cf"/><path d="M30 48v4M24 33l6 4" stroke="#0e7c72" stroke-width="4" stroke-linecap="round"/><circle cx="46" cy="38" r="8" fill="#fff" stroke="#119c8f" stroke-width="3"/><circle cx="44" cy="36" r="1.8" fill="#ef8a17"/><circle cx="48.5" cy="40" r="1.5" fill="#d9467a"/></svg>`
};
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
function europaStars(){const S=read('laura-europa-v1');if(!S)return 0;let n=0;
  for(let b=0;b<5;b++)for(const m of['find','cap'])if((S.best&&S.best[b+'-'+m]||0)>=.75)n++;return n}
function bioStars(key,total){const S=read(key);if(!S||!S.stars)return 0;return Object.values(S.stars).filter(Boolean).length}

const MATERIAS=[
 {id:'geografia',name:'Geografía',c:'var(--geo)',bg:'#e4eefc',icon:'geo',sub:'Mapas, países y capitales',
  temas:[{n:'🌍',name:'Europa: países y capitales',desc:'36 países en 5 bloques',href:'geografia/europa/',stars:europaStars,total:10}]},
 {id:'biologia',name:'Biología',c:'var(--bio)',bg:'#dff4f1',icon:'bio',sub:'Biología y Geología · 1º ESO',
  temas:[{n:'2',name:'Microorganismos',desc:'Moneras, protoctistas, hongos y virus',href:'biologia/tema-2/',stars:()=>bioStars('laura-bio-t2-v1'),total:10}]}
];

function bar(t){const s=t.stars(),p=Math.round(100*s/t.total);return `<div class="bar"><i style="width:${p}%"></i></div><p>⭐ ${s} de ${t.total} estrellas</p>`}

function renderHome(){
  document.getElementById('materias').innerHTML=MATERIAS.map(m=>{
    const s=m.temas.reduce((a,t)=>a+t.stars(),0),tot=m.temas.reduce((a,t)=>a+t.total,0);
    return `<button class="card" style="--c:${m.c}" onclick="go('${m.id}')">
      <div class="ic" style="background:${m.bg}">${ICON[m.icon]}</div>
      <div class="info"><h3>${m.name}</h3><p>${m.temas.length} ${m.temas.length===1?'tema':'temas'} · ${m.sub}</p>
      <div class="bar"><i style="width:${Math.round(100*s/tot)}%"></i></div></div><span class="go">›</span></button>`}).join('');
}
function renderMateria(m){
  const sc=document.getElementById('s-materia');sc.style.setProperty('--c',m.c);
  document.getElementById('m-title').innerHTML=`<span>${m.name}</span>`;
  document.getElementById('m-sub').textContent='Elige el tema que quieras repasar.';
  document.getElementById('temas').innerHTML=m.temas.map(t=>`<a class="card" style="--c:${m.c}" href="${t.href}">
      <div class="tnum">${t.n}</div><div class="info"><h3>${t.name}</h3><p>${t.desc}</p>${bar(t)}</div><span class="go">›</span></a>`).join('');
}
function go(id){location.hash=id}
function route(){
  const id=location.hash.slice(1),m=MATERIAS.find(x=>x.id===id);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  if(m){renderMateria(m);document.getElementById('s-materia').classList.add('on')}
  else{renderHome();document.getElementById('s-home').classList.add('on')}
  scrollTo(0,0);
}
addEventListener('hashchange',route);addEventListener('pageshow',route);route();
</script>
</body>
</html>
