<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europa paso a paso</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a37; --muted:#6b7280; --paper:#fbf7ef; --card:#ffffff; --line:#e7e0d2;
  --sea:#d3e6e8; --land:#ece5d6; --land2:#e2dac8;
  --ok:#2fa866; --bad:#e0484d;
  --b0:#2f6fd6; --b1:#119c8f; --b2:#ef8a17; --b3:#d9467a; --b4:#7a52c7; --b5:#1f3a5f;
  --blk:#2f6fd6; --blk-soft:#cfe0fb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif}
.screen{display:none;height:100dvh;flex-direction:column;max-width:760px;margin:0 auto}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home{overflow-y:auto;padding:22px 16px 28px}
.hello{font-size:15px;color:var(--muted);font-weight:700;margin:4px 0 0}
#home h1{font-size:34px;line-height:1.05;margin:4px 0 6px;letter-spacing:-.5px}
#home h1 span{color:var(--b0)}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.4}
.total{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:16px}
.total .bar{flex:1;height:10px;border-radius:99px;background:#efe9dd;overflow:hidden}
.total .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b0),var(--b4));border-radius:99px;transition:width .5s}
.total b{font-family:Fredoka;font-size:18px;min-width:52px;text-align:right}
.blocks{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.bcard{width:100%;min-width:0;position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.bcard:active{transform:scale(.98)}
.bnum{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:Fredoka;font-weight:700;font-size:24px}
.binfo{flex:1;min-width:0}
.binfo h3{margin:0;font-size:19px}
.binfo p{margin:4px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:6px;margin-top:6px;font-size:12px;font-weight:800;color:var(--muted)}
.stars span{padding:2px 8px;border-radius:99px;background:#f3eee4}
.stars span.got{background:#fff3c4;color:#8a6200}
.bcard.locked{opacity:.55}
.bcard.locked .bnum{background:#b9b2a3!important}
.lock{font-size:20px}
.foot{margin-top:22px;display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted)}
.foot button{text-decoration:underline;color:var(--muted);font-size:13px}

/* ---------- GAME ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.ttl{flex:1;min-width:0}
.ttl h2{margin:0;font-size:20px;line-height:1.1}
.ttl small{color:var(--muted);font-weight:700;font-size:12px}
.tabs{display:flex;gap:6px;padding:0 12px 8px}
.tab{flex:1;padding:9px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px}
.tab.on{background:var(--blk);border-color:var(--blk);color:#fff}
.prompt{margin:0 12px 8px;min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.prompt .q{flex:1;font-family:Fredoka;font-size:21px;font-weight:500;line-height:1.15}
.prompt .q b{color:var(--blk);font-weight:700}
.prompt .q small{display:block;font-family:Nunito;font-size:13px;color:var(--muted);font-weight:700}
.prog{font-family:Fredoka;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.say{width:40px;height:40px;border-radius:12px;background:var(--blk-soft);font-size:18px;flex:none}
.mapwrap{position:relative;flex:1;min-height:200px;margin:0 12px;border-radius:18px;overflow:hidden;background:var(--sea);border:1px solid #c3dae6}
svg{width:100%;height:100%;display:block;touch-action:manipulation}
path.bg{fill:var(--land2);stroke:#fff;stroke-width:.6}
path.g{fill:var(--land);stroke:#fff;stroke-width:.8;transition:fill .25s}
path.g.inb{fill:color-mix(in srgb,var(--blk) 30%,white);stroke:color-mix(in srgb,var(--blk) 75%,black);stroke-width:1.3}
path.g.seen{fill:color-mix(in srgb,var(--blk) 45%,white)}
path.g.hl{fill:var(--blk)}
path.g.ok{fill:var(--ok)!important}
path.g.bad{fill:var(--bad)!important}
@media (hover:hover){path.g.inb:hover{filter:brightness(.96)}}
.cap{fill:#1f2a37;stroke:#fff;stroke-width:1.2;pointer-events:none;transition:opacity .2s}
.cap.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{r:7}}
.hit{fill:transparent}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:7px 14px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.panel{padding:10px 12px calc(12px + env(safe-area-inset-bottom));min-height:118px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:13px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:16px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px}
.chip.seen{background:var(--blk-soft);border-color:transparent}
.chip.cur{background:var(--blk);color:#fff;border-color:var(--blk)}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.card .n{flex:1;font-family:Fredoka;font-size:22px;font-weight:600;line-height:1.1}
.card .n small{display:block;font-family:Nunito;font-size:14px;color:var(--muted);font-weight:700}
.card .n small b{color:var(--ink)}
.hint{font-size:13px;color:var(--muted);font-weight:700;text-align:center;margin:4px 0 0}
.big{width:100%;padding:14px;border-radius:16px;background:var(--blk);color:#fff;font-family:Fredoka;font-weight:600;font-size:18px;box-shadow:0 3px 0 color-mix(in srgb,var(--blk) 70%,black)}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);margin-top:8px}

/* ---------- ICONS & TIPS ---------- */
.ico{flex:none;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.prompt .ico{width:52px;height:52px;margin:-4px 0}
.strip{display:flex;margin-top:6px}
.strip img{width:30px;height:30px;margin-right:-6px;object-fit:contain}
.bcard.locked .strip img{filter:grayscale(1);opacity:.6}
.tip{display:flex;gap:10px;align-items:flex-start;background:#fff8dc;border:1px solid #f1e3a6;border-radius:14px;padding:9px 12px;margin-bottom:8px;font-weight:700;font-size:14px;line-height:1.35;color:#5b4a12}
.fb{display:flex;gap:12px;align-items:center;border-radius:16px;padding:10px 12px;animation:pop .25s ease-out}
.fb.ok{background:#e3f6ea;border:1px solid #b8e6c9}
.fb.no{background:#fdecec;border:1px solid #f5c2c3}
.fb .ico{width:72px;height:72px}
.fb .t{flex:1;font-size:15px;font-weight:700;line-height:1.35}
.fb .t b{font-family:Fredoka;font-size:19px;font-weight:600}
.fb .t small{display:block;color:#4b5563;font-size:13.5px;margin-top:3px}
.pista{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-weight:800;font-size:14px;color:var(--muted);animation:pop .25s ease-out}
.pista img{width:54px;height:54px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.miss span{display:inline-flex;align-items:center;gap:6px}
.miss img{width:26px;height:26px}

/* ---------- RESULT ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.overlay.on{display:flex}
.sheet{width:100%;max-width:760px;background:var(--paper);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));text-align:center;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .emo{font-size:52px;line-height:1}
.sheet h2{margin:8px 0 4px;font-size:26px}
.sheet p{margin:0 0 14px;color:var(--muted);font-weight:700}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-4px 0 14px}
.miss span{background:#fde4e4;color:#9b1c1f;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
</style>
</head>
<body>

<section id="home" class="screen on">
  <p class="hello">¡Hola, Laura! 👋</p>
  <h1>Europa <span>paso a paso</span></h1>
  <p class="sub">Cinco bloques pequeños. Primero explora, luego encuentra los países y al final aprende sus capitales. Consigue las dos estrellas para abrir el siguiente bloque.</p>
  <div class="total"><span>⭐</span><div class="bar"><i id="totbar"></i></div><b id="tot">0/10</b></div>
  <div class="blocks" id="blocks"></div>
  <div class="foot"><button id="unlockAll">Abrir todos los bloques</button><button id="reset">Empezar de cero</button></div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button class="back" id="back" aria-label="Volver">←</button>
    <div class="ttl"><h2 id="gtitle"></h2><small id="gsub"></small></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-m="explore">👀 Explorar</button>
    <button class="tab" data-m="find">📍 Encontrar</button>
    <button class="tab" data-m="cap">🏛️ Capitales</button>
  </div>
  <div class="prompt"><div class="q" id="q"></div><button class="say" id="say" aria-label="Escuchar" hidden>🔊</button><span class="prog" id="prog"></span></div>
  <div class="mapwrap">
    <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="toast" id="toast"></div>
  </div>
  <div class="panel" id="panel"></div>
</section>

<div class="overlay" id="over"><div class="sheet" id="sheet"></div></div>

const icon=(g,c='ico')=>`<img class="${c}" src="img/${CODE[g.id]}.webp" alt="" loading="lazy">`;
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const byId={};DATA.game.forEach(g=>byId[g.id]=g);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- storage (optional) ---------- */
const KEY='laura-europa-v1';
let S={best:{},seen:{},unlockAll:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const star=(b,m)=>(S.best[b+'-'+m]||0)>=PASS;
function unlocked(b){
  if(S.unlockAll||b===0)return true;
  if(b===5){for(let i=0;i<5;i++)if(!(star(i,'find')&&star(i,'cap')))return false;return true}
  return star(b-1,'find')&&star(b-1,'cap');
}
const members=b=>BLOCKS[b].all?DATA.game.filter(g=>true):DATA.game.filter(g=>g.b===b);

/* ---------- sound + voice ---------- */
let AC;
function tone(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq=ok?[660,880]:[300,220];seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
  o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+i*.1);
  g.gain.exponentialRampToValueAtTime(.15,AC.currentTime+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.1+.18);
  o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.2)})}catch(e){}}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('es-ES'))||speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('es'));
  if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- home ---------- */
function renderHome(){
  const el=$('#blocks');el.innerHTML='';let tot=0;
  BLOCKS.forEach((B,i)=>{
    const ok=unlocked(i),ms=members(i);
    const f=star(i,'find'),c=star(i,'cap');if(i<5)tot+=f+c;
    const b=document.createElement('button');b.className='bcard'+(ok?'':' locked');
    b.innerHTML=`<div class="bnum" style="background:var(${B.col})">${B.all?'🏆':i+1}</div>
      <div class="binfo"><h3>${B.name}</h3>${B.all?'':`<div class="strip">${ms.map(m=>icon(m,'')).join('')}</div>`}<p>${B.all?'Los 36 países mezclados':ms.map(m=>m.n).sort((a,b)=>a.localeCompare(b,'es')).join(' · ')}</p>
      <div class="stars">${B.all?`<span class="${star(i,'mix')?'got':''}">${star(i,'mix')?'⭐':'☆'} Desafío</span>`:`<span class="${f?'got':''}">${f?'⭐':'☆'} Países</span><span class="${c?'got':''}">${c?'⭐':'☆'} Capitales</span>`}</div></div>
      ${ok?'':'<span class="lock">🔒</span>'}`;
    b.onclick=()=>{if(ok)openBlock(i);else toastHome(i)};
    el.appendChild(b);
  });
  $('#tot').textContent=tot+'/10';$('#totbar').style.width=(tot*10)+'%';
}
function toastHome(i){alert(`Para abrir «${BLOCKS[i].name}» consigue antes las dos estrellas de «${BLOCKS[i-1].name}».`)}
$('#unlockAll').onclick=()=>{if(confirm('¿Abrir todos los bloques sin tener que ganar las estrellas?')){S.unlockAll=true;save();renderHome()}};
$('#reset').onclick=()=>{if(confirm('¿Borrar todas las estrellas y empezar de cero?')){S={best:{},seen:{},unlockAll:false};save();renderHome()}};

/* ---------- map ---------- */
const svg=$('#map');let paths={},caps={};
(function buildMap(){
  svg.setAttribute('viewBox',`0 0 ${DATA.W} ${DATA.H}`);
  const gb=document.createElementNS(NS,'g');DATA.bg.forEach(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','bg');gb.appendChild(p)});svg.appendChild(gb);
  const gg=document.createElementNS(NS,'g');DATA.game.forEach(g=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',g.d);p.setAttribute('class','g');p.dataset.id=g.id;gg.appendChild(p);paths[g.id]=p});svg.appendChild(gg);
  const gh=document.createElementNS(NS,'g');DATA.game.filter(g=>g.a<1300).forEach(g=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',(g.bb[0]+g.bb[2])/2);c.setAttribute('cy',(g.bb[1]+g.bb[3])/2);c.setAttribute('r',11);c.setAttribute('class','hit');c.dataset.id=g.id;gh.appendChild(c)});svg.appendChild(gh);
  const gc=document.createElementNS(NS,'g');DATA.game.forEach(g=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',g.cap[0]);c.setAttribute('cy',g.cap[1]);c.setAttribute('r',4);c.setAttribute('class','cap');caps[g.id]=c;gc.appendChild(c)});svg.appendChild(gc);
  svg.addEventListener('click',e=>{const id=e.target.dataset&&e.target.dataset.id;if(id)onTap(+id)});
})();
let vb=[0,0,DATA.W,DATA.H],anim;
function zoomTo(ms){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ms.forEach(g=>{x0=Math.min(x0,g.bb[0]);y0=Math.min(y0,g.bb[1]);x1=Math.max(x1,g.bb[2]);y1=Math.max(y1,g.bb[3])});
  const pad=Math.max(x1-x0,y1-y0)*.06;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
  const to=[x0,y0,x1-x0,y1-y0],from=vb.slice(),t0=performance.now();cancelAnimationFrame(anim);
  const step=t=>{const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3);vb=from.map((v,i)=>v+(to[i]-v)*e);svg.setAttribute('viewBox',vb.join(' '));if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
  const scale=Math.max(to[2],to[3])/DATA.W;
  Object.values(caps).forEach(c=>c.setAttribute('r',Math.max(2.2,4.5*scale)));
}
function paint(){
  DATA.game.forEach(g=>{const p=paths[g.id];p.setAttribute('class','g'+(cur.set.has(g.id)?' inb':''))});
}
function showCaps(on,ids){DATA.game.forEach(g=>{caps[g.id].style.opacity=on&&(!ids||ids.has(g.id))?1:0;caps[g.id].classList.remove('pulse')})}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1500)}

/* ---------- game state ---------- */
let cur={b:0,mode:'explore',set:new Set(),ms:[]},Q=null;
function openBlock(b){
  const B=BLOCKS[b];cur.b=b;cur.ms=members(b);cur.set=new Set(cur.ms.map(m=>m.id));
  document.documentElement.style.setProperty('--blk',css(B.col));
  document.documentElement.style.setProperty('--blk-soft',`color-mix(in srgb, ${css(B.col)} 22%, white)`);
  $('#gtitle').textContent=(B.all?'':'Bloque '+(b+1)+' · ')+B.name;
  $('#gsub').textContent=cur.ms.length+' países y sus capitales';
  $('#tabs').style.display=B.all?'none':'flex';
  $('#home').classList.remove('on');$('#game').classList.add('on');
  vb=[0,0,DATA.W,DATA.H];svg.setAttribute('viewBox',vb.join(' '));
  setTimeout(()=>zoomTo(cur.ms),50);
  setMode(B.all?'mix':'explore');
}
$('#back').onclick=()=>{speechSynthesis&&speechSynthesis.cancel();$('#game').classList.remove('on');$('#home').classList.add('on');renderHome()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
function setMode(m){
  cur.mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m));
  paint();Q=null;$('#say').hidden=true;
  if(m==='explore')startExplore();else startQuiz(m);
}

/* ---------- explore ---------- */
let sel=null;
function seenSet(){return new Set(S.seen[cur.b]||[])}
function startExplore(){
  sel=null;showCaps(true,cur.set);$('#prog').textContent='';
  renderExplore();
}
function renderExplore(){
  const seen=seenSet();
  cur.ms.forEach(g=>paths[g.id].classList.toggle('seen',seen.has(g.id)));
  if(sel)paths[sel].classList.add('hl');
  $('#prog').textContent=seen.size+'/'+cur.ms.length;
  if(!sel){$('#q').innerHTML='Toca un país del mapa<small>o elige uno de la lista para ver su capital</small>'}
  else{const g=byId[sel];$('#q').innerHTML=`<div style="display:flex;gap:10px;align-items:center">${icon(g)}<div><b>${g.n}</b><small>Su capital es ${g.c}</small></div></div>`}
  const sy=$('#say');sy.hidden=!sel;if(sel){const g=byId[sel];sy.onclick=()=>speak(`${g.n}. Su capital es ${g.c}. ${TIP[g.id]}`)}
  const p=$('#panel');p.innerHTML='';
  if(sel){const tp=document.createElement('div');tp.className='tip';tp.innerHTML=`<span>💡</span><span>${TIP[sel]}</span>`;p.appendChild(tp)}
  const ch=document.createElement('div');ch.className='chips';
  cur.ms.slice().sort((a,b)=>a.n.localeCompare(b.n,'es')).forEach(g=>{const b=document.createElement('button');
    b.className='chip'+(seen.has(g.id)?' seen':'')+(sel===g.id?' cur':'');b.textContent=g.n;b.onclick=()=>exploreSel(g.id);ch.appendChild(b)});
  p.appendChild(ch);
  if(seen.size===cur.ms.length&&!sel){const h=document.createElement('p');h.className='hint';h.textContent='¡Los has visto todos! Ahora prueba 📍 Encontrar.';p.appendChild(h)}
}
function exploreSel(id){
  sel=id;const s=seenSet();s.add(id);S.seen[cur.b]=[...s];save();
  DATA.game.forEach(g=>caps[g.id].classList.toggle('pulse',g.id===id));
  renderExplore();
}

/* ---------- quiz ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(m){
  const items=shuffle(cur.ms).map((g,i)=>({g,type:m==='mix'?(i%2?'find':'cap'):m,rev:Math.random()<.4}));
  Q={m,queue:items,total:items.length,done:0,first:0,missed:new Set(),tries:0,lock:false};
  showCaps(m!=='find',null);showCaps(false);
  next();
}
function next(){
  if(!Q.queue.length)return finish();
  paint();Q.tries=0;Q.lock=false;Q.it=Q.queue[0];
  $('#prog').textContent=Q.done+'/'+Q.total;
  const {g,type,rev}=Q.it;showCaps(false);
  if(type==='find'){
    $('#q').innerHTML=`<div style="display:flex;gap:10px;align-items:center">${icon(g)}<div><small>Toca en el mapa</small><b>${g.n}</b></div></div>`;
    $('#panel').innerHTML=`<p class="hint">La imagen es de su capital. Si te equivocas te digo qué país has tocado; tienes dos intentos.</p>`;
  }else{
    paths[g.id].classList.add('hl');caps[g.id].style.opacity=1;caps[g.id].classList.add('pulse');
    const pool=(BLOCKS[cur.b].all?DATA.game:cur.ms).filter(x=>x.id!==g.id);
    let others=shuffle(pool).slice(0,3);
    if(others.length<3)others=others.concat(shuffle(DATA.game.filter(x=>x.id!==g.id&&!others.includes(x))).slice(0,3-others.length));
    const opts=shuffle([g,...others]);
    $('#q').innerHTML=rev?`<b>${g.c}</b> es la capital de…`:`¿Cuál es la capital de <b>${g.n}</b>?`;
    const box=document.createElement('div');box.className='opts';
    opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=rev?o.n:o.c;b.onclick=()=>answerCap(o,b,box);box.appendChild(b)});
    $('#panel').innerHTML='';$('#panel').appendChild(box);
  }
}
function onTap(id){
  if(cur.mode==='explore'){if(cur.set.has(id))exploreSel(id);else toast(byId[id].n+' (otro bloque)');return}
  if(!Q||Q.lock||Q.it.type!=='find')return;
  const g=Q.it.g;
  if(id===g.id){paths[id].classList.add('ok');tone(true);toast('¡Bien! '+g.n);feedback(g,true);good(1700)}
  else{
    Q.tries++;paths[id].classList.add('bad');tone(false);
    toast('Eso es '+byId[id].n+(cur.set.has(id)?'':' (otro bloque)'));
    setTimeout(()=>paths[id].classList.remove('bad'),900);
    if(Q.tries>=2){Q.lock=true;setTimeout(()=>{paths[g.id].classList.add('hl');toast(g.n+' está aquí 👆');feedback(g,false)},700);bad(3000)}
  }
}
function answerCap(o,btn,box){
  if(Q.lock)return;const g=Q.it.g;
  if(o.id===g.id){btn.classList.add('ok');tone(true);setTimeout(()=>feedback(g,true),350);good(2000)}
  else{Q.tries++;btn.classList.add('bad');tone(false);btn.disabled=true;
    if(Q.tries===1&&!$('.pista')){const h=document.createElement('div');h.className='pista';h.innerHTML=`${icon(g,'')}<span>Pista: ¿te suena este monumento?</span>`;$('#panel').appendChild(h)}
    if(Q.tries>=2){Q.lock=true;[...box.children].forEach(b=>{if(b.textContent===(Q.it.rev?g.n:g.c))b.classList.add('ok')});
      $('#q').innerHTML=`La capital de <b>${g.n}</b> es <b>${g.c}</b>`;setTimeout(()=>feedback(g,false),700);bad(3200)}}
}
function feedback(g,ok){
  $('#panel').innerHTML=`<div class="fb ${ok?'ok':'no'}">${icon(g)}<div class="t">${ok?'✅ ':'👉 '}<b>${g.n}</b> · capital <b>${g.c}</b><small>💡 ${TIP[g.id]}</small></div></div>`;
}
function good(){
  Q.lock=true;const it=Q.queue.shift();
  if(Q.tries===0&&!Q.missed.has(it.g.id))Q.first++;
  Q.done++;setTimeout(next,arguments[0]||750);
}
function bad(wait){
  Q.missed.add(Q.it.g.id);const it=Q.queue.shift();
  const pos=Math.min(Q.queue.length,2+(Math.random()*2|0));Q.queue.splice(pos,0,it);
  setTimeout(next,wait);
}
function finish(){
  const sc=Q.first/Q.total,key=cur.b+'-'+(Q.m==='mix'?'mix':Q.m);
  const before=star(cur.b,Q.m),wasUnl=unlocked(cur.b+1);
  S.best[key]=Math.max(S.best[key]||0,sc);save();
  const nowStar=sc>=PASS,newUnl=cur.b<5&&!wasUnl&&unlocked(cur.b+1);
  const emo=sc===1?'🏆':nowStar?'⭐':sc>=.5?'💪':'🌱';
  const msg=sc===1?'¡Perfecto! Todos a la primera.':nowStar?'¡Estrella conseguida!':'Casi. Repite y lo tendrás.';
  const missed=[...Q.missed].map(id=>byId[id]);
  let nextBtn='';
  if(Q.m==='find'&&nowStar)nextBtn=`<button class="big" id="goCap">Ahora las capitales 🏛️</button>`;
  else if(newUnl)nextBtn=`<button class="big" id="goNext">Abrir «${BLOCKS[cur.b+1].name}» 🔓</button>`;
  $('#sheet').innerHTML=`<div class="emo">${emo}</div><h2>${msg}</h2>
    <p>${Q.first} de ${Q.total} a la primera${nowStar?'':' · necesitas '+Math.ceil(PASS*Q.total)}</p>
    ${missed.length?`<p style="margin-bottom:8px">Para repasar:</p><div class="miss">${missed.map(g=>`<span>${icon(g,'')}${g.n} · ${g.c}</span>`).join('')}</div>`:''}
    ${nextBtn}<button class="big ${nextBtn?'alt':''}" id="again">Otra vez</button><button class="big alt" id="toHome">Volver a los bloques</button>`;
  $('#over').classList.add('on');
  if(nowStar)confetti();
  $('#again').onclick=()=>{$('#over').classList.remove('on');setMode(Q.m)};
  $('#toHome').onclick=()=>{$('#over').classList.remove('on');$('#back').click()};
  const gc=$('#goCap');if(gc)gc.onclick=()=>{$('#over').classList.remove('on');setMode('cap')};
  const gn=$('#goNext');if(gn)gn.onclick=()=>{$('#over').classList.remove('on');openBlock(cur.b+1)};
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['--b0','--b1','--b2','--b3','--b4'];
  for(let i=0;i<60;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=css(cols[i%5]);s.style.animationDelay=Math.random()*.6+'s';s.style.animationDuration=1.2+Math.random()*.9+'s';c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}

renderHome();
</script>
