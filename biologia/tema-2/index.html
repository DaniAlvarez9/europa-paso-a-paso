<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microorganismos · Biología Tema 2</title>
<meta name="theme-color" content="#0e7c72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a37;--muted:#6b7280;--paper:#fbf7ef;--card:#fff;--line:#e7e0d2;
  --ok:#2fa866;--bad:#e0484d;
  --b0:#119c8f;--b1:#2f6fd6;--b2:#7a52c7;--b3:#3c9a3c;--b4:#d9467a;--b5:#e07a10;
  --blk:#119c8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{background:radial-gradient(circle at 12% 8%,#e5f6f2 0,transparent 32%),radial-gradient(circle at 92% 30%,#efe8fb 0,transparent 28%),radial-gradient(circle at 10% 80%,#fde9ef 0,transparent 26%),var(--paper);background-attachment:fixed}
button,a{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-decoration:none}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif}
.screen{display:none;height:100dvh;flex-direction:column;max-width:760px;margin:0 auto}
.screen.on{display:flex}
b{font-weight:800}

/* guía */
.guide{display:flex;align-items:flex-end;gap:8px;margin:0 0 14px}
.guide .mic{width:64px;height:64px;flex:none;animation:bob 2.6s ease-in-out infinite}
.bubble{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 13px;font-weight:700;font-size:14.5px;line-height:1.38;box-shadow:0 2px 0 var(--line)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes wiggle{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes jump{30%{transform:translateY(-12px) scale(1.05)}60%{transform:translateY(0) scale(.97)}}

/* portada: camino */
#home{overflow-y:auto;padding:22px 16px 28px}
.tohub{align-self:flex-start;font-weight:800;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;margin-bottom:8px}
#home h1{font-size:32px;line-height:1.05;margin:4px 0 10px;letter-spacing:-.5px}
#home h1 span{color:var(--b0)}
.hud{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.total{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.total .bar{flex:1;height:10px;border-radius:99px;background:#efe9dd;overflow:hidden}
.total .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b0),var(--b2),var(--b4));border-radius:99px;transition:width .5s}
.total b{font-family:Fredoka;font-size:18px}
.albumbtn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ffe48a,#ffc94d);border:1px solid #f0c040;border-radius:18px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 0 #e0b030}
.albumbtn span{font-size:22px}
.path{position:relative;padding:10px 0 6px;max-width:560px;margin:0 auto;width:100%}
.path svg.trail{z-index:0}.stop{z-index:1}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stop{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 22px;width:100%}
.stop.r{flex-direction:row-reverse;text-align:right}
.node{position:relative;flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e9e2d4 0);transition:transform .15s}
.node::before{content:'';position:absolute;inset:6px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,white);border:3px solid #fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#d8d0c0)}
.node svg{position:relative;width:50px;height:50px}
.node:active{transform:scale(.94)}
.node .lk{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:15px}
.stop.locked .node{filter:grayscale(1)}.stop.locked .node svg{opacity:.55}.stop.locked .plabel{background:#f7f3ec;color:#9b9384}.stop.locked .plabel p{color:#b2aa9b}
.stop.cur .node{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.plabel{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 2px 0 var(--line)}
.plabel h3{margin:0;font-size:18px;line-height:1.1}
.plabel p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-weight:700}
.stars{display:flex;gap:5px;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--muted);flex-wrap:wrap}
.stop.r .stars{justify-content:flex-end}
.stars span{padding:2px 8px;border-radius:99px;background:#f3eee4}
.stars span.got{background:#fff3c4;color:#8a6200}
.here{position:absolute;top:-30px;width:56px;height:56px;pointer-events:none}
.here .mic{width:56px;height:56px;animation:bob 2.6s ease-in-out infinite}
.stop:not(.r) .here{left:62px}.stop.r .here{right:62px}
.foot{margin-top:10px;display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted)}
.foot button{text-decoration:underline;color:var(--muted);font-size:13px}

/* bloque */
.top{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.ttl{flex:1;min-width:0}
.ttl h2{margin:0;font-size:20px;line-height:1.1}
.ttl small{color:var(--muted);font-weight:700;font-size:12px}
.tabs{display:flex;gap:6px;padding:0 12px 8px}
.tab{flex:1;padding:9px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px;position:relative}
.tab.on{background:var(--blk);border-color:var(--blk);color:#fff}
.tab .st{position:absolute;top:-7px;right:-4px;font-size:13px}
.body{flex:1;overflow-y:auto;padding:4px 12px calc(16px + env(safe-area-inset-bottom))}

/* aprender */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;box-shadow:0 2px 0 var(--line);animation:pop .25s ease-out}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lhead svg{width:58px;height:58px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
.lhead h3{margin:0;font-size:24px;line-height:1.05}
.lhead small{display:block;font-family:Nunito;font-size:13px;color:var(--muted);font-weight:800}
.lcard ul{margin:8px 0 10px;padding-left:20px}
.lcard li{margin:7px 0;font-size:16px;line-height:1.4}
.lcard li b{color:color-mix(in srgb,var(--blk) 80%,black)}
.fig{margin:6px 0 4px;border-radius:16px;background:color-mix(in srgb,var(--blk) 7%,white);border:1px solid color-mix(in srgb,var(--blk) 18%,white);padding:10px}
.fig>svg{width:100%;height:auto;display:block}
.fig .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.fig .row.r3{grid-template-columns:repeat(3,1fr)}
.fig .row.r2{grid-template-columns:repeat(2,1fr)}
.fig .cell{background:#fff;border-radius:12px;padding:6px 4px;font-weight:800;font-size:13px;line-height:1.15;border:1px solid var(--line)}
.fig .cell small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}
.fig .cell .e{font-size:28px;line-height:1.1;display:block}
.fig .cell svg{width:56px;height:44px;margin:0 auto 2px;display:block}
.fig .lab{font-size:12px;font-weight:800;color:var(--muted);text-align:center;margin-top:6px}
.tip{display:flex;gap:10px;align-items:flex-start;background:#fff8dc;border:1px solid #f1e3a6;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14.5px;line-height:1.38;color:#5b4a12;margin-top:6px}
.tip span{font-size:20px;line-height:1}
.links{display:grid;gap:6px;margin-top:8px}
.links a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:#fff0f0;border:1px solid #f6caca;font-weight:800;font-size:14px;color:#8f1d1d}
.links a span{font-size:18px}
.check{margin-top:10px;border:2px dashed color-mix(in srgb,var(--blk) 40%,white);border-radius:16px;padding:10px 12px}
.check .cq{font-weight:800;font-size:15px;margin-bottom:8px}
.check .cq em{font-style:normal;color:var(--blk)}
.check .copts{display:flex;flex-wrap:wrap;gap:6px}
.check .copts button{padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:14px}
.check .cfb{margin-top:8px;font-weight:700;font-size:14px}
.pz{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:8px;border-radius:14px;background:#eef2f0;border:1px solid #dde5e1;text-align:left;font-weight:800;font-size:14px;color:#365049}
.pz img{width:84px;height:46px;object-fit:cover;border-radius:8px;flex:none}
.nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.nav button.arrow{width:52px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font-size:22px;font-weight:800}
.nav button.arrow:disabled{opacity:.35}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:99px;background:#ddd5c5}
.dots i.on{background:var(--blk);width:20px}
.dots i.seen{background:color-mix(in srgb,var(--blk) 45%,white)}

/* preguntas */
.qbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;animation:pop .25s ease-out}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px;gap:8px}
.streak{background:#fff1e0;color:#b45309;border-radius:99px;padding:2px 9px;font-size:12.5px}
.streak.hot{animation:jump .5s}
.hearts{letter-spacing:1px;font-size:15px}
.pts{background:#eef4ff;color:#1e4fa8;border-radius:99px;padding:2px 9px}
.pbar{height:6px;border-radius:99px;background:#efe9dd;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--blk);border-radius:99px;transition:width .3s}
.qtext{font-family:Fredoka;font-size:21px;font-weight:500;line-height:1.2}
.qfig{max-width:210px;margin:8px auto 0}
.qfig svg{width:100%;height:auto;display:block}
.item{text-align:center;padding:6px 0 2px}
.item .name{font-family:Fredoka;font-size:27px;font-weight:600;line-height:1.12}
.item .desc{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.item .ifig{width:150px;margin:0 auto}
.item .ifig svg{width:100%;height:auto;display:block}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bins.n3{grid-template-columns:1fr 1fr 1fr}
.bin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px 9px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:15px;line-height:1.1;text-align:center}
.bin svg{width:46px;height:40px}
.bin .e{font-size:30px;line-height:1.1}
.bin small{font-size:11.5px;color:var(--muted);font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:700;font-size:16px;line-height:1.3}
.opts.vf{grid-template-columns:1fr 1fr}
.opts.vf .opt{text-align:center;font-family:Fredoka;font-size:19px}
.slots{display:grid;gap:6px;margin-bottom:10px}
.slot{min-height:46px;border-radius:14px;border:2px dashed #d9d0bf;display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:700;font-size:15px;color:var(--muted)}
.slot b{font-family:Fredoka;font-size:18px;color:var(--blk);min-width:16px}
.slot.full{border-style:solid;border-color:var(--line);background:var(--card);color:var(--ink)}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;box-shadow:none!important}
.ok small,.ok b{color:#e8fff0!important}
.bad{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important;box-shadow:none!important}
.bad small,.bad b{color:#ffe9e9!important}
.dim{opacity:.45}
.used{visibility:hidden}
.fb{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:10px 12px;margin-top:10px;animation:pop .25s ease-out}
.fb.okk{background:#e3f6ea;border:1px solid #b8e6c9}
.fb.no{background:#fdecec;border:1px solid #f5c2c3}
.fb .mic{width:60px;height:60px;flex:none}
.fb.okk .mic{animation:jump .6s}
.fb.no .mic{animation:wiggle .6s}
.fb .t{flex:1;font-size:15px;font-weight:700;line-height:1.38}
.fb .t strong{display:block;font-family:Fredoka;font-size:19px;font-weight:600;margin-bottom:2px}
.big{width:100%;padding:14px;border-radius:16px;background:var(--blk);color:#fff;font-family:Fredoka;font-weight:600;font-size:18px;box-shadow:0 3px 0 color-mix(in srgb,var(--blk) 70%,black);margin-top:10px}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.intro{text-align:center;padding:10px 4px}
.intro .mic{width:110px;height:110px;animation:bob 2.6s ease-in-out infinite}
.intro h2{font-size:28px;margin:6px 0}
.intro p{font-weight:700;color:var(--muted);line-height:1.45;margin:0 0 8px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.rules div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;font-weight:800;font-size:13px}
.rules div span{display:block;font-size:28px}

/* figuras animadas */
.bipL,.bipR{animation-duration:4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.bipL{animation-name:bipL}.bipR{animation-name:bipR}
@keyframes bipL{0%,20%{transform:translateX(20px)}50%{transform:translateX(0)}80%,100%{transform:translateX(-26px)}}
@keyframes bipR{0%,20%{transform:translateX(-20px)}50%{transform:translateX(0)}80%,100%{transform:translateX(26px)}}
.flag{animation:flag 1s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes flag{50%{transform:scaleY(-1)}}
.cil{animation:cil .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes cil{to{transform:rotate(25deg)}}
.blob{animation:blob 3s ease-in-out infinite}
@keyframes blob{50%{d:path("M18 34c-8-10 2-20 12-14 4-10 18-10 20 0 12-4 18 8 10 14 8 6 2 16-8 14-2 10-16 10-20 2-8 4-18-2-14-8-6-2-6-6 0-8z")}}
.sun{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bubbleup{animation:up2 2.4s ease-in infinite}
@keyframes up2{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
.spore{animation:spore 3s ease-out infinite}
@keyframes spore{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),40px);opacity:0}}
.part{transition:opacity .2s}
.hl{animation:hl 1s ease-in-out infinite}
@keyframes hl{50%{opacity:.35}}
.balloon{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.25);transition:transform 2.6s cubic-bezier(.3,1.4,.6,1)}
.lab2{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.lab2 button{padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:14px}

/* álbum */
#album .body{padding-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cromo{perspective:700px;aspect-ratio:3/4}
.cromo .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.cromo.flip .in{transform:rotateY(180deg)}
.cromo .f,.cromo .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.cromo .f{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,white),color-mix(in srgb,var(--c) 50%,white))}
.cromo .f svg{width:70%;height:auto;max-height:55%}
.cromo .f b{font-family:Fredoka;font-size:14px;line-height:1.1;margin-top:4px}
.cromo .f small{font-size:10.5px;font-weight:800;color:#4b5563}
.cromo .b{transform:rotateY(180deg);background:#fff;font-size:12px;font-weight:700;line-height:1.3;gap:6px;color:#374151}
.cromo .b b{font-family:Fredoka;font-size:13px;color:var(--c)}
.cromo.locked .f{background:repeating-linear-gradient(45deg,#ece6da,#ece6da 8px,#e4ddcf 8px,#e4ddcf 16px)}
.cromo.locked .f svg{filter:brightness(0) opacity(.18)}
.cromo.locked .f b{color:#9b9384}
.cromo .num{position:absolute;top:6px;left:8px;font-family:Fredoka;font-size:11px;color:#6b7280}
.newc{display:flex;gap:8px;justify-content:center;margin:0 0 14px;flex-wrap:wrap}
.newc .cromo{width:86px}

/* capas */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.overlay.on{display:flex}
.sheet{width:100%;max-width:760px;max-height:92dvh;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));text-align:center;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet>.mic{width:96px;height:96px;animation:jump .7s}
.sheet h2{margin:4px 0 4px;font-size:26px}
.sheet p{margin:0 0 14px;color:var(--muted);font-weight:700}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-4px 0 14px}
.miss span{background:#fde4e4;color:#9b1c1f;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
#photo{align-items:center;background:rgba(10,14,20,.92)}
#photo .pwrap{width:100%;height:100%;overflow:auto;display:flex;align-items:center;-webkit-overflow-scrolling:touch}
#photo img{width:100%;max-width:1200px;margin:auto;display:block}
#photo.zoom img{width:220%;max-width:none}
#photo .pbtns{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px}
#photo .pbtns button{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.95);font-size:20px;font-weight:800}
#photo .cap{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:13px;opacity:.85}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="home" class="screen on">
  <a class="tohub" href="../../#biologia">← Biología</a>
  <h1>Tema 2 · <span>Microorganismos</span></h1>
  <div class="guide" id="hguide"></div>
  <div class="hud">
    <div class="total"><span>⭐</span><div class="bar"><i id="totbar"></i></div><b id="tot">0/11</b></div>
    <button class="albumbtn" id="openAlbum"><span>🃏</span><b id="albc">0/18</b></button>
  </div>
  <div class="path" id="path"></div>
  <div class="foot"><button id="unlockAll">Abrir todos los bloques</button><button id="reset">Empezar de cero</button></div>
</section>

<section id="block" class="screen">
  <div class="top">
    <button class="back" id="back" aria-label="Volver">←</button>

/* ---------- estado ---------- */
const PASS=0.75,FINAL_N=20,LIVES=3;
const KEY='laura-bio-t2-v1';
let S={stars:{},best:{},seen:{},unlockAll:false,cards:{},hi:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const has=(b,m)=>!!S.stars[b+'-'+m];
const done=b=>has(b,'sort')&&has(b,'exam');
const NB=BLOCKS.filter(b=>!b.final);
function unlocked(i){const b=BLOCKS[i];if(S.unlockAll||i===0)return true;
  if(b.final)return NB.every(x=>done(x.id));return done(BLOCKS[i-1].id)}
const cardOwned=c=>c.b==='final'?has('final','run'):done(c.b);
const totalStars=()=>Object.values(S.stars).filter(Boolean).length;
const TSTARS=NB.length*2+1;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const md=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let AC;
function tone(ok,big){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq=big?[660,880,1100]:ok?[660,880]:[300,220];seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
  o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+i*.1);
  g.gain.exponentialRampToValueAtTime(.15,AC.currentTime+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.1+.18);
  o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.2)})}catch(e){}}
function confetti(){const c=document.createElement('div');c.className='confetti';
  const cols=['#119c8f','#2f6fd6','#ef8a17','#d9467a','#7a52c7','#2fa866'];
  for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%6];
    e.style.animationDelay=Math.random()*.5+'s';e.style.animationDuration=1.2+Math.random()*.9+'s';c.appendChild(e)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}
const OK_MSG=['¡Bien!','¡Eso es!','¡Correcto!','¡Genial!','¡Muy bien!','¡Exacto!','¡Crack!'];
const NO_MSG=['¡Casi!','Uy, no era esa','No pasa nada','¡Ups!'];

/* ---------- portada: camino ---------- */
function renderHome(){
  $('#unlockAll').textContent=S.unlockAll?'Volver a cerrar los bloques':'Abrir todos los bloques';
  const n=totalStars(),owned=ALBUM.filter(cardOwned).length;
  $('#tot').textContent=n+'/'+TSTARS;$('#totbar').style.width=(100*n/TSTARS)+'%';$('#albc').textContent=owned+'/'+ALBUM.length;
  const curI=BLOCKS.findIndex((b,i)=>unlocked(i)&&!(b.final?has('final','run'):done(b.id)));
  const msg=n===0?'¡Hola, Laura! Soy <b>Micro</b> 👋 Sigue el camino: cada bloque completo te da <b>cromos</b> para tu álbum. ¡Empieza por el 1!':
    n<TSTARS?`¡Llevas <b>${n} ${n===1?'estrella':'estrellas'}</b> y <b>${owned} cromos</b>! ${curI>=0?`Te toca: <b>${BLOCKS[curI].name}</b>.`:''} 💪`:'¡Lo tienes TODO! Eres una experta en microorganismos. 🏆';
  $('#hguide').outerHTML=`<div class="guide" id="hguide">${MIC(n?'wow':'happy')}<div class="bubble">${msg}</div></div>`;
  $('#path').innerHTML=`<svg class="trail" id="trail"></svg>`+BLOCKS.map((b,i)=>{
    const u=unlocked(i),r=i%2===1;
    const p=b.final?(has('final','run')?100:0):((has(b.id,'sort')?50:0)+(has(b.id,'exam')?50:0));
    const st=b.final?`<div class="stars"><span class="${has('final','run')?'got':''}">${has('final','run')?'🏆':'🏁'} ${S.hi?'Récord: '+S.hi+' pts':'20 preguntas · ❤️❤️❤️'}</span></div>`:
      `<div class="stars"><span class="${has(b.id,'sort')?'got':''}">${has(b.id,'sort')?'⭐':'☆'} Clasificar</span><span class="${has(b.id,'exam')?'got':''}">${has(b.id,'exam')?'⭐':'☆'} Examen</span></div>`;
    return `<div class="stop ${r?'r':''} ${u?'':'locked'} ${i===curI?'cur':''}" data-i="${i}">
      <button class="node" style="--c:var(${b.c});--p:${p}" aria-label="${b.name}">${IC[b.final?'trophy':b.ic]}${u?(p===100?'<span class="lk">✅</span>':''):'<span class="lk">🔒</span>'}</button>
      ${i===curI&&n>0?`<div class="here">${MIC('happy')}</div>`:''}
      <div class="plabel"><h3>${b.final?'🏁 ':(i+1)+'. '}${b.name}</h3><p>${b.desc}</p>${st}</div></div>`}).join('');
  requestAnimationFrame(drawTrail);
  document.querySelectorAll('.stop').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i,b=BLOCKS[i];
    if(!unlocked(i))return msgSheet('think','Bloque cerrado',b.final?'Completa los 5 bloques (las dos estrellas de cada uno) para abrir el Desafío.':'Consigue las dos estrellas del bloque anterior para abrirlo.');
    if(b.final)return openFinal();
    openBlock(i,'learn')});
}
function drawTrail(){const path=$('#path'),svg=$('#trail');if(!svg)return;const R=path.getBoundingClientRect();
  const pts=[...document.querySelectorAll('.node')].map(n=>{const r=n.getBoundingClientRect();return[r.left-R.left+r.width/2,r.top-R.top+r.height/2]});
  let d='';pts.forEach((p,i)=>{if(!i){d=`M${p[0]} ${p[1]}`;return}const q=pts[i-1],my=(q[1]+p[1])/2;d+=` C${q[0]} ${my} ${p[0]} ${my} ${p[0]} ${p[1]}`});
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#d9cfbd" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/>`}
addEventListener('resize',()=>{if($('#home').classList.contains('on'))drawTrail()});
function msgSheet(m,h,p){sheet(`${MIC(m)}<h2>${h}</h2><p>${p}</p><button class="big" onclick="closeSheet()">Vale</button>`)}
$('#unlockAll').onclick=()=>{S.unlockAll=!S.unlockAll;save();renderHome()};
$('#reset').onclick=()=>{sheet(`${MIC('oops')}<h2>¿Empezar de cero?</h2><p>Se borrarán las estrellas, los cromos y el récord de este tema.</p>
  <button class="big" id="rs">Sí, borrar</button><button class="big alt" onclick="closeSheet()">Cancelar</button>`);
  $('#rs').onclick=()=>{S={stars:{},best:{},seen:{},unlockAll:false,cards:{},hi:0};save();closeSheet();renderHome()}};

/* ---------- álbum ---------- */
function cromo(c,i,forceOpen){const own=forceOpen||cardOwned(c);const B=BLOCKS.find(b=>b.id===c.b);
  return `<div class="cromo ${own?'':'locked'}" style="--c:${cssv(B.c)}" data-id="${c.id}"><div class="in">
    <div class="f"><span class="num">${i+1}</span>${c.hue&&own?icon(c.ic).replace('<svg ',`<svg style="filter:hue-rotate(${c.hue}deg)" `):icon(c.ic)}<b>${own?c.n:'???'}</b><small>${own?c.r:(B.final?'Desafío':B.name)}</small></div>
    <div class="b"><b>${c.n}</b>${c.d.map(x=>`<div>${x}</div>`).join('')}</div></div></div>`}
function renderAlbum(){const owned=ALBUM.filter(cardOwned).length;
  $('#asub').textContent=`${owned} de ${ALBUM.length} cromos`;
  $('#grid').innerHTML=ALBUM.map((c,i)=>cromo(c,i)).join('');
  document.querySelectorAll('#grid .cromo').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('locked')){const c=ALBUM.find(x=>x.id===el.dataset.id),B=BLOCKS.find(b=>b.id===c.b);
      return msgSheet('think','Cromo bloqueado',B.final?'Gana el Desafío del tema para conseguirlo.':`Consigue las dos estrellas de <b>${B.name}</b> para conseguirlo.`)}
    el.classList.toggle('flip')})}
$('#openAlbum').onclick=()=>{renderAlbum();show('album')};

function openBlock(i,mode){CUR=i;const b=BLOCKS[i];
  document.documentElement.style.setProperty('--blk',cssv(b.c));
  $('#btitle').textContent=(i+1)+'. '+b.name;$('#bsub').textContent=b.desc;
  $('#tabs').style.display='';show('block');setMode(mode)}
function setMode(m){MODE=m;const b=BLOCKS[CUR];
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',t.dataset.m===m);
    const st=t.querySelector('.st');if(st)st.textContent=has(b.id,t.dataset.m)?'⭐':''});
  $('#body').scrollTop=0;
  if(m==='learn')learn(0);else startQuiz(m)}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
$('#back').onclick=()=>{if(Q&&Q.kind==='final'&&Q.live&&!confirm('¿Salir del Desafío? Perderás esta partida.'))return;Q=null;show('home');renderHome()};

/* aprender */
function learn(k){const b=BLOCKS[CUR],L=b.learn,c=L[k];
  S.seen[b.id+'-'+k]=1;save();
  const intro=k===0&&b.hello?guide('happy',b.hello):'';
  $('#body').innerHTML=`${intro}<div class="lcard">
    <div class="lhead">${IC[c.ic]}<div><h3>${c.t}</h3><small>${c.s}</small></div></div>
    ${c.fig?`<div class="fig">${FIG[c.fig]()}</div>`:''}
    <ul>${c.p.map(x=>`<li>${md(x)}</li>`).join('')}</ul>
    <div class="tip"><span>💡</span><div>${c.tip}</div></div>
    ${c.links?`<div class="links">${c.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener"><span>${u.includes('youtu')?'▶️':'📝'}</span>${t}</a>`).join('')}</div>`:''}
    ${c.check?`<div class="check"><div class="cq"><em>¿Te acuerdas?</em> ${c.check[0]}</div><div class="copts">${shuffle(c.check[1].map((o,i)=>[o,i])).map(([o,i])=>`<button data-i="${i}">${o}</button>`).join('')}</div><div class="cfb"></div></div>`:''}
    <button class="pz" id="pz"><img src="img/pizarra/p${c.pz}.webp" alt="">📷 Ver lo que escribió la profesora en la pizarra</button>
  </div>
  <div class="nav"><button class="arrow" id="prev" ${k===0?'disabled':''}>‹</button>
    <div class="dots">${L.map((_,j)=>`<i class="${j===k?'on':S.seen[b.id+'-'+j]?'seen':''}"></i>`).join('')}</div>
    <button class="arrow" id="next" ${k===L.length-1?'disabled':''}>›</button></div>
  ${k===L.length-1?`<button class="big" id="tosort">¡Ya lo tengo! A clasificar 🧺</button>`:''}`;
  if(c.fig&&FIG_INIT[c.fig])FIG_INIT[c.fig]();
  $('#prev').onclick=()=>learn(k-1);$('#next').onclick=()=>learn(k+1);
  $('#pz').onclick=()=>openPhoto(c.pz);
  if($('#tosort'))$('#tosort').onclick=()=>setMode('sort');
  document.querySelectorAll('.check .copts button').forEach(el=>el.onclick=()=>{
    const ok=el.dataset.i==='0';tone(ok);
    document.querySelectorAll('.check .copts button').forEach(x=>{x.disabled=true;if(x.dataset.i==='0')x.classList.add('ok');else if(x===el)x.classList.add('bad');else x.classList.add('dim')});
    $('.check .cfb').innerHTML=(ok?'✅ '+pick(OK_MSG)+' ':'🤔 ')+c.check[2]});
  swipe($('#body'),d=>{if(d>0&&k<L.length-1)learn(k+1);if(d<0&&k>0)learn(k-1)});
}
function swipe(el,cb){let x0=null,y0=null;el.ontouchstart=e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY};
  el.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)cb(dx<0?1:-1);x0=null}}
function openPhoto(n){$('#pimg').src='img/pizarra/p'+n+'.webp';$('#photo').classList.remove('zoom');$('#photo').classList.add('on')}
$('#pclose').onclick=()=>$('#photo').classList.remove('on');
$('#pzoom').onclick=()=>$('#photo').classList.toggle('zoom');

/* ---------- motor de preguntas (clasificar, examen y desafío) ---------- */
let Q=null;
const asItems=(b,t)=>(t==='sort'?b.sort:b.exam).map((x,i)=>({i,x,t,b:b.id,uid:b.id+t+i}));
function startQuiz(kind){const b=BLOCKS[CUR];
  const items=asItems(b,kind);
  Q={kind,queue:shuffle(items),total:items.length,done:0,first:new Set(),missed:new Set(),tried:new Set(),streak:0,best:0};
  nextQ()}
function head(){const pct=100*Q.done/Q.total;
  if(Q.kind==='final')return `<div class="qtop"><span class="hearts">${'❤️'.repeat(Q.lives)}${'🤍'.repeat(LIVES-Q.lives)}</span>
    ${Q.streak>=2?`<span class="streak ${Q.streak%3===0?'hot':''}">🔥 ${Q.streak}</span>`:''}<span class="pts">${Q.pts} pts</span><span>${Q.done+Q.wrong}/${Q.total}</span></div>
    <div class="pbar"><i style="width:${100*(Q.done+Q.wrong)/Q.total}%"></i></div>`;
  return `<div class="qtop"><span>${Q.kind==='sort'?'🧺 Clasificar':'✏️ Preguntas de examen'}</span>
   ${Q.streak>=2?`<span class="streak ${Q.streak%3===0?'hot':''}">🔥 ${Q.streak} seguidas</span>`:''}<span>${Q.done}/${Q.total}</span></div>
   <div class="pbar"><i style="width:${pct}%"></i></div>`}
function nextQ(){if(!Q)return;if(!Q.queue.length||(Q.kind==='final'&&Q.lives<=0))return finish();const it=Q.queue[0];
  const tag=Q.kind==='final'?(()=>{const B=BLOCKS.find(x=>x.id===it.b);return `<div style="font-size:12px;font-weight:800;color:${cssv(B.c)};margin-bottom:4px">${B.name}</div>`})():'';
  if(it.t==='sort'){const [n,d,set,,,ex]=it.x,SET=SETS[set],ks=Object.keys(SET.opts);
    const shown=ex&&ex.fig?`<div class="ifig">${icon(ex.fig)}</div>`:`<div class="name">${n}</div>${d?`<div class="desc">${d}</div>`:''}`;
    $('#body').innerHTML=`<div class="qbox"><div class="qh">${head()}</div>${tag}<div class="qtext" style="text-align:center;font-size:16px;color:var(--muted)">${SET.q}</div>
      <div class="item">${shown}</div></div>
      <div class="bins ${ks.length===3?'n3':''}">${ks.map(k=>{const g=SET.opts[k];
        const vis=g.ic?IC[g.ic]:g.fig?icon(g.fig):`<span class="e">${g.e}</span>`;
        return `<button class="bin" data-k="${k}">${vis}${g.n}<small>${g.s}</small></button>`}).join('')}</div><div id="fbx"></div>`;
    document.querySelectorAll('.bin').forEach(el=>el.onclick=()=>answerSort(el));return}
  const [q,opts,,ex={}]=it.x;
  if(ex.order){
    $('#body').innerHTML=`<div class="qbox"><div class="qh">${head()}</div>${tag}<div class="qtext">🔢 ${q}</div><div style="font-size:13px;color:var(--muted);font-weight:700;margin-top:4px">Toca los pasos en orden.</div></div>
      <div class="slots">${opts.map((_,i)=>`<div class="slot" data-s="${i}"><b>${i+1}</b><span></span></div>`).join('')}</div>
      <div class="opts">${shuffle(opts.map((o,i)=>[o,i])).map(([o,i])=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div id="fbx"></div>`;
    const seq=[];document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      const s=document.querySelector(`.slot[data-s="${seq.length}"]`);s.classList.add('full');s.querySelector('span').textContent=el.textContent;
      seq.push(+el.dataset.i);el.classList.add('used');
      if(seq.length===opts.length){const ok=seq.every((v,i)=>v===i);
        document.querySelectorAll('.slot').forEach((sl,i)=>{sl.classList.add(seq[i]===i?'ok':'bad')});
        answer(ok,ok?'':`El orden es: ${opts.map((o,i)=>`<b>${i+1}.</b> ${o}`).join(' · ')}.`)}});return}
  const order=ex.vf?[0,1].sort((a,b)=>opts[a]==='Verdadero'?-1:1):shuffle(opts.map((o,i)=>i));
  $('#body').innerHTML=`<div class="qbox"><div class="qh">${head()}</div>${tag}<div class="qtext">${ex.vf?'¿Verdadero o falso?<br><span style="font-size:19px;font-weight:600">'+q+'</span>':q}</div>
      ${ex.fig?`<div class="qfig">${icon(ex.fig)}</div>`:''}</div>
    <div class="opts ${ex.vf?'vf':''}">${order.map(i=>`<button class="opt" data-i="${i}">${opts[i]}</button>`).join('')}</div><div id="fbx"></div>`;
  document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{const ok=el.dataset.i==='0';
    document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.i==='0')b.classList.add('ok');else if(b===el)b.classList.add('bad');else b.classList.add('dim')});
    answer(ok)});
}
function answerSort(el){const it=Q.queue[0],g=it.x[3],ok=el.dataset.k===g;
  document.querySelectorAll('.bin').forEach(b=>{b.disabled=true;if(b.dataset.k===g)b.classList.add('ok');else if(b===el)b.classList.add('bad');else b.classList.add('dim')});
  answer(ok)}
function answer(ok,extra){const it=Q.queue[0],why=it.t==='sort'?it.x[4]:it.x[2];
  if(!Q.tried.has(it.uid)){Q.tried.add(it.uid);if(ok)Q.first.add(it.uid);else Q.missed.add(it.uid)}
  Q.queue.shift();
  let gain=0;
  if(ok){Q.done++;Q.streak++;Q.best=Math.max(Q.best,Q.streak);if(Q.kind==='final'){gain=10+5*Math.min(Q.streak-1,4);Q.pts+=gain}}
  else{Q.streak=0;if(Q.kind==='final'){Q.lives--;Q.wrong++}else Q.queue.push(it)}
  const milestone=ok&&Q.streak%5===0;
  tone(ok,milestone);if(milestone)confetti();
  const h=ok?(milestone?`¡${Q.streak} seguidas! 🔥`:pick(OK_MSG))+(gain?` <span class="pts">+${gain}</span>`:''):(Q.kind==='final'?(Q.lives>0?'¡Pierdes una vida! 💔':'¡Sin vidas! 💔'):pick(NO_MSG));
  const later=Q.kind==='final'?'':'<br><small style="color:#6b7280">Te la volveré a preguntar al final.</small>';
  const last=!Q.queue.length||(Q.kind==='final'&&Q.lives<=0);
  $('#fbx').innerHTML=`<div class="fb ${ok?'okk':'no'}">${MIC(ok?(milestone?'wow':'happy'):'oops')}<div class="t"><strong>${h}</strong>${extra?extra+'<br>':''}${why}${ok?'':later}</div></div>
  <button class="big" id="nx">${last?'Ver resultado':'Siguiente →'}</button>`;
  $('.qh').innerHTML=head();
  $('#nx').onclick=nextQ;$('#nx').scrollIntoView({behavior:'smooth',block:'end'})}
function label(it){const x=it.x;if(it.t==='sort'){const ex=x[5];return ex&&ex.fig?SETS[x[2]].opts[x[3]].n:x[0]}return x[0].length>38?x[0].slice(0,36)+'…':x[0]}
function finish(){
  if(Q.kind==='final')return finishFinal();
  const b=BLOCKS[CUR],sc=Q.first.size/Q.total,key=b.id+'-'+Q.kind;
  const wasDone=done(b.id);
  S.best[key]=Math.max(S.best[key]||0,sc);const got=sc>=PASS,was=!!S.stars[key];if(got)S.stars[key]=1;save();
  const all=asItems(b,Q.kind),names=[...new Set(all.filter(it=>Q.missed.has(it.uid)).map(label))];
  const other=Q.kind==='sort'?'exam':'sort';
  if(got)confetti();
  const perfect=Q.first.size===Q.total;
  const newCards=!wasDone&&done(b.id)?ALBUM.filter(c=>c.b===b.id):[];
  sheet(`${MIC(got?'wow':'think')}<h2>${perfect?'¡Pleno! 🏆':got?(was?'¡Otra vez genial!':'¡Estrella conseguida! ⭐'):'¡Casi lo tienes!'}</h2>
    <p>${Q.first.size} de ${Q.total} a la primera · mejor racha 🔥 ${Q.best}.${got?'':' Necesitas '+Math.ceil(PASS*Q.total)+' para la estrella.'}</p>
    ${newCards.length?`<p style="margin-bottom:8px;color:var(--ink)">🃏 ¡Bloque completo! Has ganado ${newCards.length===1?'un cromo nuevo':newCards.length+' cromos nuevos'}:</p><div class="newc">${newCards.map(c=>cromo(c,ALBUM.indexOf(c),true)).join('')}</div>`:''}
    ${names.length?`<p style="margin-bottom:8px">Micro te recomienda repasar:</p><div class="miss">${names.map(n=>`<span>${n}</span>`).join('')}</div>`:''}
    ${got&&!has(b.id,other)?`<button class="big" id="s1">${other==='exam'?'Ir al examen ✏️':'Ir a clasificar 🧺'}</button>`:''}
    ${got&&has(b.id,other)?`<button class="big" id="s3">Volver al camino 🗺️</button>`:''}
    ${!got?`<button class="big" id="s4">Repasar en Aprender 📖</button>`:''}
    <button class="big alt" id="s2">Repetir</button>`);
  document.querySelectorAll('.newc .cromo').forEach(el=>el.onclick=()=>el.classList.toggle('flip'));
  if($('#s1'))$('#s1').onclick=()=>{closeSheet();setMode(other)};
  if($('#s3'))$('#s3').onclick=()=>{closeSheet();Q=null;show('home');renderHome()};
  if($('#s4'))$('#s4').onclick=()=>{closeSheet();setMode('learn')};
  $('#s2').onclick=()=>{closeSheet();setMode(Q.kind)};
  document.querySelectorAll('.tab').forEach(t=>{const st=t.querySelector('.st');if(st)st.textContent=has(b.id,t.dataset.m)?'⭐':''});
}

/* ---------- Desafío final ---------- */
function openFinal(){CUR=BLOCKS.length-1;const b=BLOCKS[CUR];
  document.documentElement.style.setProperty('--blk',cssv(b.c));
  $('#btitle').textContent='🏁 '+b.name;$('#bsub').textContent=b.desc;$('#tabs').style.display='none';show('block');Q=null;
  $('#body').innerHTML=`<div class="intro">${MIC('wow')}<h2>¡El Desafío del tema!</h2>
    <p>Preguntas de <b>todos los bloques</b> mezcladas, como en un examen de verdad.</p>
    <div class="rules"><div><span>❓</span>${FINAL_N} preguntas</div><div><span>❤️</span>${LIVES} vidas</div><div><span>🔥</span>Rachas = más puntos</div></div>
    <p>Termina con al menos una vida para ganar el 🏆 y el último cromo.${S.hi?`<br>Tu récord: <b>${S.hi} puntos</b>.`:''}</p>
    <button class="big" id="go">¡Empezar!</button></div>`;
  $('#go').onclick=startFinal}
function startFinal(){const per=Math.ceil(FINAL_N/NB.length);let pool=[];
  NB.forEach(b=>{const ex=shuffle(asItems(b,'exam')),so=shuffle(asItems(b,'sort'));pool=pool.concat(shuffle(ex.slice(0,Math.ceil(per/2)+1).concat(so.slice(0,Math.floor(per/2)))).slice(0,per))});
  Q={kind:'final',queue:shuffle(pool).slice(0,FINAL_N),total:FINAL_N,done:0,wrong:0,lives:LIVES,pts:0,first:new Set(),missed:new Set(),tried:new Set(),streak:0,best:0,live:true};
  Q.total=Q.queue.length;nextQ()}
function finishFinal(){Q.live=false;const won=Q.lives>0,first=!has('final','run');
  if(won)S.stars['final-run']=1;const rec=Q.pts>(S.hi||0);if(rec)S.hi=Q.pts;save();
  if(won)confetti();
  const card=won&&first?ALBUM.filter(c=>c.b==='final'):[];
  const missed=[...Q.tried].filter(u=>Q.missed.has(u));
  sheet(`${MIC(won?'wow':'oops')}<h2>${won?'¡Desafío superado! 🏆':'¡Sin vidas!'}</h2>
    <p>${Q.done} aciertos · <b>${Q.pts} puntos</b>${rec?' · ¡nuevo récord! 🎉':` · récord: ${S.hi}`}<br>mejor racha 🔥 ${Q.best}</p>
    ${card.length?`<p style="margin-bottom:8px;color:var(--ink)">🃏 ¡Has ganado el último cromo!</p><div class="newc">${card.map(c=>cromo(c,ALBUM.indexOf(c),true)).join('')}</div>`:''}
    ${!won?'<p>Repasa los bloques donde fallaste y vuelve a intentarlo. ¡Tú puedes! 💪</p>':''}
    <button class="big" id="f1">Jugar otra vez</button><button class="big alt" id="f2">Volver al camino 🗺️</button>`);
  document.querySelectorAll('.newc .cromo').forEach(el=>el.onclick=()=>el.classList.toggle('flip'));
  $('#f1').onclick=()=>{closeSheet();startFinal()};
  $('#f2').onclick=()=>{closeSheet();Q=null;show('home');renderHome()}}

function sheet(h){$('#sheet').innerHTML=h;$('#over').classList.add('on')}
function closeSheet(){$('#over').classList.remove('on')}
$('#over').onclick=e=>{if(e.target.id==='over')closeSheet()};

renderHome();
</script>
</body>
</html>
